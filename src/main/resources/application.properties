spring.application.name=taskboard-backend
server.port=8080

# JSON keys in declaration order (Jackson 3 sorts them alphabetically by default), so that problem
# details read title, status, detail, instance.
spring.jackson.mapper.sort-properties-alphabetically=false

# Local database: in-memory H2 in DB2 mode, migrated by Flyway (src/main/resources/db/migration).
# Its data is gone when the backend stops.
spring.datasource.url=jdbc:h2:mem:taskboard;MODE=DB2;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks that the entities fit it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# TIMESTAMP columns hold UTC, whatever the time zone of the JVM.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Dates go to JDBC as java.time values. Converted to java.sql.Date, a date before 1900, such as the
# host's earliest, 0001-01-01, would be stored days off.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true

# The H2 TCP server through which the datasync shares the local database:
# jdbc:h2:tcp://localhost:9092/mem:taskboard;MODE=DB2, user sa, empty password.
taskboard.h2.tcp.enabled=true
taskboard.h2.tcp.port=9092
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
